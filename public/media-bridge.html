<!DOCTYPE html><html><head><meta charset="utf-8"><title>SABBAQ media</title><meta name="robots" content="noindex"></head><body>
<script>
// Sends SABBAQ's public showcase media to an embedding LinkedIn page (used to attach project media).
const files = [
  ["1-dashboard.png","image/png"],["2-before-after.png","image/png"],["3-simulation-lab.png","image/png"],
  ["4-airport-studio.png","image/png"],["5-analytics.png","image/png"],["SABBAQ-Portfolio.pdf","application/pdf"]];
(async () => {
  const target = window.parent !== window ? window.parent : window.opener;
  if (!target) { document.body.textContent = "SABBAQ media"; return; }
  for (const [name, type] of files) {
    const buf = await (await fetch("./media/" + name)).arrayBuffer();
    target.postMessage({ kind: "sabbaq-file", name, type, buf }, "https://www.linkedin.com", [buf]);
  }
  target.postMessage({ kind: "sabbaq-done" }, "https://www.linkedin.com");
  document.body.textContent = "Media sent. You can close this tab.";
})();
</script></body></html>
